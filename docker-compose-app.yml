version: '3.8'

services:
  user-service:
    image: mutual-help/user-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis
      - rabbitmq

  order-service:
    image: mutual-help/order-service:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis
      - elasticsearch

  payment-service:
    image: mutual-help/payment-service:latest
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis

  message-service:
    image: mutual-help/message-service:latest
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis
      - rabbitmq

  gateway:
    image: mutual-help/gateway:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

networks:
  default:
    name: mutual-help-network
