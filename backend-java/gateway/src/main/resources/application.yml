server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/user/**
          filters:
            - StripPrefix=2

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/order/**
          filters:
            - StripPrefix=2

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/wechat-pay/**
          filters:
            - StripPrefix=2

        - id: message-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/message/**
          filters:
            - StripPrefix=2

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
